          {"platform_name":"ubuntu","os":"ubuntu-26.04","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5","prepare":"sudo apt update; sudo apt install libsdl3-0 libsdl3-image0 libsdl3-ttf0 -y", "name": "26.04 runtimes only (runner provides headers)"}
