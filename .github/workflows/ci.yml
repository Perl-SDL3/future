  windows:
    name: Windows
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      #~ This task runs under git-bash (run-direct.yml `shell: bash`), but
      #~ native xmake.exe spawns from deep perl-under-bash chains fail with
      #~ "Inappropriate I/O control operation" (EINVAL on CreateProcess). That
      #~ is a CI-env artifact, not a code bug: t/00-05 pass under PowerShell
      #~ (native Win32 spawning), which is what the passing 0.08 release used.
      #~ So build + test on PowerShell, keeping strawberry perl on PATH.
      task: |
        export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
        perl -e 'print qq(perl=\$^X :: \$^O\n)'
        curl -fsSL https://cpanmin.us -o /c/cpanmin.pl
        perl /c/cpanmin.pl App::cpanminus
        rm -f /c/cpanmin.pl
        export XMAKE_ROOT=y
        cpanm --notest IO::Socket::SSL || true
        cpanm -v . || true
        if ! perl -MAlien::Xmake -MAlien::Xrepo -MAlien::Xrepo::MB -MAlien::Xrepo::Build -e 1 2>/dev/null; then
          echo "Alien toolchain modules failed to install -- dumping build logs"
          for f in "$HOME/.cpanm/work"/*/build.log; do echo "=== $f ==="; tail -120 "$f"; done
          exit 1
        fi
      matrix: >
        [
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"gcc","prepare":"choco install make -y; curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54051_64bit/strawberry-perl-5.40.5.1-64bit-portable.zip && powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip && ln -sf /c/Strawberry/c/bin/gcc.exe /c/Strawberry/c/bin/cc.exe"},
