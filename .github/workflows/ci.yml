        #~ is no `cc` at all and a missing first candidate makes IPC::Open3 die
        #~ before it ever tries gcc, so point /usr/bin/cc at the real gcc.
        cc_src=$(command -v gcc 2>/dev/null || true)
        if [ "$(uname -s)" = SunOS ] && [ -n "$cc_src" ]; then ln -sf "$cc_src" /usr/bin/cc 2>/dev/null || true; fi
        echo "cc=$(command -v cc || true) gcc=$cc_src make=$(command -v make || true) gmake=$(command -v gmake || true)"
        echo 'int main(){return 0;}' | cc -xc - -o /dev/null - 2>/dev/null && echo 'cc compile OK' || echo 'cc compile FAILED'
        #~ SunOS /bin/sh is ksh93 in POSIX mode, which lacks xmake's configure
        #~ prerequisite `local` builtin; the run then dies with "please set
        #~ toolchain in the toolchain scope!". Swap the /bin/sh shebang target
        #~ for bash for the duration of the toolchain install on SunOS.
        if [ "$(uname -s)" = SunOS ] && [ -x /usr/bin/bash ]; then rm -f /bin/sh 2>/dev/null || true; ln -sf /usr/bin/bash /bin/sh; fi
        #~ illumos/Solaris gcc hides strncasecmp & friends unless __EXTENSIONS__
        #~ is defined, which breaks xmake's from-source core build. xmake's
        #~ configure merges $CFLAGS/$CXXFLAGS/$LDFLAGS from the environment, so
        #~ export the define/flags instead of shadowing gcc with wrapper scripts.
        #~ The 32-bit illumos core build also needs -lsocket/-lnsl for its socket
        #~ symbols and, on OmniOS, libsendfile for sendfile64 (Solaris resolves
        #~ both from libc).
        if [ "$(uname -s)" = SunOS ]; then export CFLAGS="-D__EXTENSIONS__ ${CFLAGS:-}" CXXFLAGS="-D__EXTENSIONS__ ${CXXFLAGS:-}" LDFLAGS="-lsocket -lnsl ${LDFLAGS:-}"; case "$(cat /etc/release 2>/dev/null)" in *OmniOS*) export LDFLAGS="/usr/lib/libsendfile.so.1 ${LDFLAGS:-}";; esac; fi
        command -v cpanm
        export XMAKE_ROOT=y
        cpanm --notest IO::Socket::SSL || true
        cpanm -v . || true
        if ! perl -MAlien::Xmake -MAlien::Xrepo -MAlien::Xrepo::MB -MAlien::Xrepo::Build -e 1 2>/dev/null; then
          echo "Alien toolchain modules failed to install -- dumping build logs"
          for f in "$HOME/.cpanm/work"/*/build.log; do echo "=== $f ==="; tail -120 "$f"; done
          exit 1
        fi
      #~ X11 dev headers must be present or the libsdl3 recipe fails fast with
      #~ the exact apt line (see recipes/packages/l/libsdl3/xmake.lua). The
      #~ no-prereq entries below still pass because GitHub-hosted ubuntu images
      #~ pre-ship the X11 dev headers, so xmake picks the system libs; on any
      #~ image without them the guard fires instead of wedging for hours on the
      #~ from-source X11 bootstrap.
      matrix: >
        [
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5","prepare":"sudo apt-get update; sudo apt-get install -y libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxcursor-dev libxrandr-dev libxi-dev libxrender-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev"},
          {"platform_name":"ubuntu","os":"ubuntu-26.04","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5","prepare":"sudo apt-get update; sudo apt-get install -y libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxcursor-dev libxrandr-dev libxi-dev libxrender-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libsdl3-0 libsdl3-image0 libsdl3-ttf0", "name": "Ubuntu 26.04 w/ libsdl3 from package manager"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3","configure":"-Duselongdouble","variant":"longdoubles","prepare":"sudo apt-get update; sudo apt-get install -y libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxcursor-dev libxrandr-dev libxi-dev libxrender-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"gcc","perl_version":"5.40.5","prepare":"sudo apt-get update; sudo apt-get install -y libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxcursor-dev libxrandr-dev libxi-dev libxrender-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"clang","perl_version":"5.40.5","prepare":"sudo apt-get update; sudo apt-get install -y libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxcursor-dev libxrandr-dev libxi-dev libxrender-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"clang","perl_version":"5.40.5","prepare":"sudo apt-get update; sudo apt-get install -y libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxcursor-dev libxrandr-dev libxi-dev libxrender-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev"},
          {"platform_name":"ubuntu-riscv","os":"ubuntu-24.04-riscv","arch":"riscv64","toolchain":"gcc","perl_version":"5.40.5","prepare":"sudo apt-get update; sudo apt-get install -y libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxcursor-dev libxrandr-dev libxi-dev libxrender-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev"},
          {"platform_name":"ubuntu-riscv","os":"ubuntu-24.04-riscv","arch":"riscv64","toolchain":"clang","perl_version":"5.40.5","prepare":"sudo apt-get update; sudo apt-get install -y libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxcursor-dev libxrandr-dev libxi-dev libxrender-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5", "name": "no X11 dev pkgs (runner provides headers)"},
          {"platform_name":"ubuntu","os":"ubuntu-26.04","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5","prepare":"sudo apt update; sudo apt install libsdl3-0 libsdl3-image0 libsdl3-ttf0 -y", "name": "26.04 runtimes only (runner provides headers)"}
        ]

  macos:
    name: macOS
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        perl -V
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere
        #~ (Solaris/OmniOS site bin), so re-export those dirs first.
        curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        perl /tmp/cpanmin.pl App::cpanminus
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        #~ Alien::Xmake probes `cc` first, then gcc/clang. On Solaris/OmniOS there
