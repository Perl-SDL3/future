        cpanm -v . || true
        if ! perl -MAlien::Xmake -MAlien::Xrepo -MAlien::Xrepo::MB -MAlien::Xrepo::Build -e 1 2>/dev/null; then
          echo "Alien toolchain modules failed to install -- dumping build logs"
          for f in "$HOME/.cpanm/work"/*/build.log; do echo "=== $f ==="; tail -120 "$f"; done
          exit 1
        fi
      #~ OpenBSD is disabled for now: its in-VM builds are so slow they were
      #~ blocking the whole dev loop. Re-enable once the fast platforms are
      #~ fully green (prep: pkg_add gcc-11.2.0p19 g++-11.2.0p19 curl gmake git).
      matrix: >
        []

