name: CI

on:
  pull_request: ~
  push:
    branches: [main, dev, dev-repair]
  workflow_dispatch: ~

permissions:
  contents: read
  actions: read

jobs:

  linux:
    name: Linux
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        perl -V
        #~ Install cpanm via its canonical self-bootstrap (installs the real
        #~ `cpanm` binary into the active perl's bin dir). `command -v cpanm`
        #~ is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        #~ Pre-install a SHARED freetype into the xmake store. The xmake-repo
        #~ libsdl3_ttf recipe links libfreetype but never links its static
        #~ transitive deps, which dies with undefined BZ2_bzDecompress (macOS,
        #~ brew libfreetype.a) or inflate (Linux, xmake-built libfreetype.a).
        #~ A shared freetype carries those symbols itself, so the recipe's
        #~ CMake call gets a plain dynamic library instead.
        XM="$PWD/perl-dist/lib/$(perl -e 'printf qq(%vd), $^V')/auto/share/dist/Alien-Xmake/bin/xmake"
        echo "pre-installing shared freetype via: $XM"
        XMAKE_THEME=plain "$XM" lua private.xrepo install -y -k shared freetype
        cpanm -v .
      matrix: >
        [
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3","configure":"-Duselongdouble","variant":"longdoubles"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"gcc","perl_version":"5.40.5"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"clang","perl_version":"5.40.5"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"clang","perl_version":"5.40.5"}
        ]

  macos:
    name: macOS
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        perl -V
        #~ Install cpanm via its canonical self-bootstrap (installs the real
        #~ `cpanm` binary into the active perl's bin dir). `command -v cpanm`
        #~ is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        #~ Pre-install a SHARED freetype into the xmake store (see Linux task
        #~ for why: the libsdl3_ttf recipe fails to link static freetype deps).
        XM="$PWD/perl-dist/lib/$(perl -e 'printf qq(%vd), $^V')/auto/share/dist/Alien-Xmake/bin/xmake"
        echo "pre-installing shared freetype via: $XM"
        XMAKE_THEME=plain "$XM" lua private.xrepo install -y -k shared freetype
        cpanm -v .
      matrix: >
        [
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"gcc","perl_version":"5.42.3"},
          {"platform_name":"macos-intel","os":"macos-15-intel","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3"},
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"clang","perl_version":"5.42.3"},
          {"platform_name":"macos-intel","os":"macos-15-intel","arch":"x86_64","toolchain":"clang","perl_version":"5.42.3"}
        ]

  windows:
    name: Windows
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      #~ This task runs under git-bash (run-direct.yml `shell: bash`), but
      #~ native xmake.exe spawns from deep perl-under-bash chains fail with
      #~ "Inappropriate I/O control operation" (EINVAL on CreateProcess). That
      #~ is a CI-env artifact, not a code bug: t/00-05 pass under PowerShell
      #~ (native Win32 spawning), which is what the passing 0.08 release used.
      #~ So build + test on PowerShell, keeping strawberry perl on PATH.
      task: |
        export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
        perl -e 'print qq(perl=\$^X :: \$^O\n)'
        curl -L https://cpanmin.us | perl - App::cpanminus
        #~ Pre-install a SHARED freetype into the xmake store. Strawberry's
        #~ Alien-Xmake ships xmake.exe under its share dist; see the Linux task
        #~ for why shared freetype is needed (libsdl3_ttf static-link bug).
        XM="/c/Strawberry/perl/lib/auto/share/dist/Alien-Xmake/xmake.exe"
        test -f "$XM" || XM=$(find /c/Strawberry/perl -path '*/auto/share/dist/Alien-Xmake/xmake.exe' | head -n1)
        echo "pre-installing shared freetype via: $XM"
        XMAKE_THEME=plain "$XM" lua private.xrepo install -y -k shared freetype
        cpanm -v .
      matrix: >
        [
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"gcc","prepare":"choco install strawberryperl"},
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"clang","prepare":"choco install llvm strawberryperl"}
        ]

  results:
    name: Summary
    if: always()
    needs: [linux, macos, windows]
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
