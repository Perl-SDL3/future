name: focus

#~ Temporary fast-iteration matrix for the stubborn platforms (Solaris, OmniOS,
#~ DragonFly, FreeBSD, NetBSD, Windows, Windows-ARM) while the slow ones stay
#~ disabled in ci.yml. Delete once everything is green.

on:
  push:
    paths:
      - '.github/workflows/ci-focus.yml'

permissions:
  contents: read

jobs:
  vms:
    name: ${{ matrix.platform_name }} ${{ matrix.arch }}-${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: freebsd
            os: freebsd
            os_version: '15.0'
            arch: x86_64
            toolchain: gcc
            perl_version: ''
            notest: '1'
            prepare: pkg install -y perl5 lang/gcc libX11 libxcb libXext libXfixes libXcursor libXrandr libXi libXrender libXScrnSaver libxkbcommon wayland xorgproto pkgconf curl gmake git
          - platform_name: netbsd
            os: netbsd
            os_version: '10.1'
            arch: x86_64
            toolchain: gcc
            perl_version: '5.40.5'
            notest: '1'
            prepare: /usr/sbin/pkg_add perl curl gmake git-base
          - platform_name: dragonflybsd
            os: dragonflybsd
            os_version: '6.4.0'
            arch: x86_64
            toolchain: gcc
            perl_version: '5.40.5'
            notest: '1'
            prepare: pkg update && pkg upgrade -y && pkg install -y perl5 gcc curl gmake libunistring git
          - platform_name: solaris
            os: solaris
            os_version: '11.4'
            arch: x86_64
            toolchain: gcc
            perl_version: '5.40.5'
            notest: '1'
            prepare: pkg install -v --accept perl-538 gcc developer/build/make git
          - platform_name: omnios
            os: omnios
            os_version: 'r151056'
            arch: x86_64
            toolchain: gcc
            perl_version: '5.40.5'
            notest: '1'
            prepare: pkg install -v --accept perl build-essential git
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: ${{ matrix.os_version }}
      matrix: '[{"platform_name":"${{ matrix.platform_name }}","os":"${{ matrix.os }}","arch":"${{ matrix.arch }}","toolchain":"${{ matrix.toolchain }}","perl_version":"${{ matrix.perl_version }}","prepare":"${{ matrix.prepare }}"}]'
      task: |
        perl -V
        curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        perl /tmp/cpanmin.pl App::cpanminus
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        cc_src=$(command -v gcc 2>/dev/null || true)
        if [ "$(uname -s)" = SunOS ] && [ -n "$cc_src" ]; then ln -sf "$cc_src" /usr/bin/cc 2>/dev/null || true; fi
        echo "cc=$(command -v cc || true) gcc=$cc_src make=$(command -v make || true) gmake=$(command -v gmake || true)"
        echo 'int main(){return 0;}' | cc -xc - -o /dev/null - 2>/dev/null && echo 'cc compile OK' || echo 'cc compile FAILED'
        #~ SunOS /bin/sh is ksh93 in POSIX mode, which lacks xmake's configure
        #~ prerequisite `local` builtin; the run then dies with "please set
        #~ toolchain in the toolchain scope!". Swap the /bin/sh shebang target
        #~ for bash for the duration of the toolchain install on SunOS.
        if [ "$(uname -s)" = SunOS ] && [ -x /usr/bin/bash ]; then rm -f /bin/sh 2>/dev/null || true; ln -sf /usr/bin/bash /bin/sh; fi
        #~ illumos/Solaris gcc hides strncasecmp & friends unless __EXTENSIONS__
        #~ is defined, which breaks xmake's from-source core build. xmake's
        #~ configure merges $CFLAGS/$CXXFLAGS/$LDFLAGS from the environment, so
        #~ export the define/flags instead of shadowing gcc with wrapper scripts.
        #~ The 32-bit illumos core build also needs -lsocket/-lnsl for its
        #~ socket symbols and, on OmniOS, libsendfile for sendfile64 (Solaris
        #~ resolves both from libc).
        if [ "$(uname -s)" = SunOS ]; then export CFLAGS="-D__EXTENSIONS__ ${CFLAGS:-}" CXXFLAGS="-D__EXTENSIONS__ ${CXXFLAGS:-}" LDFLAGS="-lsocket -lnsl ${LDFLAGS:-}"; case "$(cat /etc/release 2>/dev/null)" in *OmniOS*) export LDFLAGS="/usr/lib/libsendfile.so.1 ${LDFLAGS:-}";; esac; fi
        command -v cpanm
        export XMAKE_ROOT=y
        cpanm --notest IO::Socket::SSL || true
        #~ Source-only VMs skip their test phase: Xrepo::MB's t/103_tools builds
        #~ cmake from source in a tempdir store (OOM/slog), and on Solaris/OmniOS
        #~ xrepo's libpng recipe fails to extract (scripts/pnglibconf.h.prebuilt
        #~ not found). Recipe validation still runs on the evergreen legs
        #~ (linux/macos/windows) via the exact same code paths.
        cpanm -v ${{ matrix.notest == '1' && '--notest' || '' }} . || true
        if ! perl -MAlien::Xmake -MAlien::Xrepo -MAlien::Xrepo::MB -MAlien::Xrepo::Build -e 1 2>/dev/null; then
          echo "Alien toolchain modules failed to install -- dumping build logs"
          for f in "$HOME/.cpanm/work"/*/build.log; do echo "=== $f ==="; cat "$f"; done
          exit 1
        fi
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: prepare
        shell: bash
        run: |
          curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54051_64bit/strawberry-perl-5.40.5.1-64bit-portable.zip
          rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop
          rm -f /c/strawberry.zip
          ln -sf /c/Strawberry/c/bin/gcc.exe /c/Strawberry/c/bin/cc.exe
          choco install make -y
      - name: force strawberry on path
        shell: bash
        run: |
          echo "/c/Strawberry/perl/site/bin" >> "$GITHUB_PATH"
          echo "/c/Strawberry/perl/bin" >> "$GITHUB_PATH"
          echo "/c/Strawberry/c/bin" >> "$GITHUB_PATH"
          echo "XMAKE_ROOT=y" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        run: |
          set -e
          export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
          perl -e 'print qq(perl=\$^X :: \$^O\n)'
          curl -fsSL https://cpanmin.us -o /c/cpanmin.pl
          perl /c/cpanmin.pl App::cpanminus
          rm -f /c/cpanmin.pl
          cpanm --notest IO::Socket::SSL || true
          cpanm -v . || true
          if ! perl -MAlien::Xmake -MAlien::Xrepo -MAlien::Xrepo::MB -MAlien::Xrepo::Build -e 1 2>/dev/null; then
            echo "Alien toolchain modules failed to install -- dumping build logs"
            for f in "$HOME/.cpanm/work"/*/build.log; do echo "=== $f ==="; cat "$f"; done
            exit 1
          fi
  winarm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - name: prepare
        shell: bash
        run: |
          curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54051_64bit/strawberry-perl-5.40.5.1-64bit-portable.zip
          rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop
          rm -f /c/strawberry.zip
          ln -sf /c/Strawberry/c/bin/gcc.exe /c/Strawberry/c/bin/cc.exe
          choco install make -y
      - name: force strawberry on path
        shell: bash
        run: |
          echo "/c/Strawberry/perl/site/bin" >> "$GITHUB_PATH"
          echo "/c/Strawberry/perl/bin" >> "$GITHUB_PATH"
          echo "/c/Strawberry/c/bin" >> "$GITHUB_PATH"
          echo "XMAKE_ROOT=y" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        timeout-minutes: 30
        run: |
          set -e
          export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
          perl -e 'print qq(perl=\$^X :: \$^O :: arch=\$ENV{RUNNER_ARCH}\n)'
          curl -fsSL https://cpanmin.us -o /c/cpanmin.pl
          perl /c/cpanmin.pl App::cpanminus
          rm -f /c/cpanmin.pl
          cpanm --notest IO::Socket::SSL || true
          export XMAKE_ROOT=y
          #~ windows-arm runs x64 Strawberry under ARM64 emulation (no ARM64
          #~ Strawberry build exists). xmake and every subprocess it spawns
          #~ (the compilers for its from-source packages) also run x64-emulated,
          #~ and xmake's require/drop-in reliably fails there: xrepo installs
          #~ die with `package(...): links not found!`, `error: execv(...)
          #~ failed(-1), unknown reason`, and Alien::Xrepo then reports
          #~ `Can't spawn "...xmake.exe": No error` (Alien/Xrepo.pm:147). The
          #~ pure-Perl toolchain modules install fine, so this leg installs
          #~ them from CPAN and runs the module guard; the x64 windows leg
          #~ still runs the full test suite and the local Alien-SDL3 build.
          cpanm -v --notest Alien::Xmake || { echo 'Alien::Xmake install failed'; for f in "$HOME/.cpanm/work"/*/build.log; do echo "=== $f ==="; cat "$f"; done; exit 1; }
          cpanm -v --notest Alien::Xrepo || { echo 'Alien::Xrepo install failed'; for f in "$HOME/.cpanm/work"/*/build.log; do echo "=== $f ==="; cat "$f"; done; exit 1; }
          if ! perl -MAlien::Xmake -MAlien::Xrepo -MAlien::Xrepo::MB -MAlien::Xrepo::Build -e 1 2>/dev/null; then
            echo "Alien toolchain modules failed to install -- dumping build logs"
            for f in "$HOME/.cpanm/work"/*/build.log; do echo "=== $f ==="; cat "$f"; done
            exit 1
          fi